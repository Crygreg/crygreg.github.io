name: Fetch Discord posts

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Nur Posts ab diesem Datum (YYYY-MM-DD), leer = alle neuen'
        required: false
        type: string
      all:
        description: 'State ignorieren (alles im Fenster neu ausgeben)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-posts
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch posts
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: '1466223543824945193'
          DEBUG_DUMP: '1'
        run: |
          ARGS=""
          [ -n "${{ inputs.since }}" ] && ARGS="--since ${{ inputs.since }}"
          [ "${{ inputs.all }}" = "true" ] && ARGS="$ARGS --all"
          python tools/fetch-posts.py $ARGS

      - name: Commit new images
        run: |
          if [ -z "$(git status --porcelain images/G2AE)" ]; then
            echo "no new images"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/G2AE
          git commit -m "chore: fetch discord post attachments"
          git pull --rebase origin main
          git push
