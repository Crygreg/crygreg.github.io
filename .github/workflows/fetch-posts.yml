name: Fetch Discord posts

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Nur Posts ab diesem Datum (YYYY-MM-DD), leer = alle neuen'
        required: false
        type: string
      all:
        description: 'State ignorieren (alles im Fenster neu ausgeben)'
        required: false
        type: boolean
        default: false
      mode:
        description: 'fetch = Posts holen, list = Channels auflisten'
        required: false
        type: choice
        options: [fetch, list]
        default: fetch

permissions:
  contents: write

concurrency:
  group: fetch-posts
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch posts
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: '1435017209994018947'
          DEBUG_DUMP: '1'
        run: |
          ARGS=""
          [ -n "${{ inputs.since }}" ] && ARGS="--since ${{ inputs.since }}"
          [ "${{ inputs.all }}" = "true" ] && ARGS="$ARGS --all"
          [ "${{ inputs.mode }}" = "list" ] && ARGS="--list-channels"
          python tools/fetch-posts.py $ARGS

      - uses: actions/upload-artifact@v4
        if: inputs.mode != 'list'
        with:
          name: post-drafts
          path: tools/posts-out/drafts.txt
          if-no-files-found: ignore

      - name: Commit new images
        run: |
          if [ -z "$(git status --porcelain images/G2AE tools/posts-out/state.json)" ]; then
            echo "no new images"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/G2AE tools/posts-out/state.json
          git commit -m "chore: fetch discord post attachments"
          git pull --rebase origin main
          git push
