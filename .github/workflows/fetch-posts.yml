name: Fetch Discord posts

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Nur Posts ab diesem Datum (YYYY-MM-DD), leer = alle neuen'
        required: false
        type: string
      all:
        description: 'State ignorieren (alles im Fenster neu ausgeben)'
        required: false
        type: boolean
        default: false
      mode:
        description: 'fetch = Posts holen, list = Channels auflisten'
        required: false
        type: choice
        options: [fetch, list]
        default: fetch
      channel:
        description: 'Channel-ID (leer = anniversary-showroom)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fetch-posts
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: python -m pip install Pillow

      - name: Fetch posts
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ inputs.channel || '1435017209994018947' }}
          DEBUG_DUMP: '1'
        run: |
          ARGS=""
          [ -n "${{ inputs.since }}" ] && ARGS="--since ${{ inputs.since }}"
          [ "${{ inputs.all }}" = "true" ] && ARGS="$ARGS --all"
          [ "${{ inputs.mode }}" = "list" ] && ARGS="--list-channels"
          python tools/fetch-posts.py $ARGS

      - name: Generate WebP variants
        if: inputs.mode != 'list'
        run: python tools/optimize-screenshots.py

      - name: Fetch YouTube thumbnails
        if: inputs.mode != 'list'
        run: |
          IDS=$(python -c "import re,os
          ids=set()
          p='tools/posts-out/drafts.txt'
          if os.path.exists(p):
              for l in open(p,encoding='utf-8'):
                  if l.startswith('youtube-ids:'):
                      ids.update(i.strip() for i in l.split(':',1)[1].split(',') if i.strip())
          print(' '.join(sorted(ids)))")
          [ -n "$IDS" ] && python tools/fetch-yt-thumbs.py $IDS || true

      - uses: actions/upload-artifact@v4
        if: inputs.mode != 'list'
        with:
          name: post-drafts
          path: tools/posts-out/drafts.txt
          if-no-files-found: ignore

      - name: Commit new images
        if: inputs.mode != 'list'
        run: |
          if [ -z "$(git status --porcelain images tools/posts-out/state.json)" ]; then
            echo "no new images"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images tools/posts-out/state.json
          git commit -m "chore: fetch discord post attachments"
          git pull --rebase origin main
          git push
