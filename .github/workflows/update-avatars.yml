name: Update Discord avatars

on:
  schedule:
    # Taeglich — synchronisiert Avatar-Aenderungen der Teammitglieder
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  avatars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch avatars
        id: fetch
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python tools/fetch-avatars.py

      - name: Commit changes
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/avatars
          git commit -m "chore: update discord avatars"
          git push
