# Deployt die statische Webseite bei jedem Push auf main zu GitHub Pages.
name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir _site
          cp ./*.html ./style.css ./fonts.css ./site.js ./sitemap.xml ./robots.txt _site/
          cp -r ./images ./fonts _site/
          # Roh-Screenshots bleiben im Repo als Archiv, aber nicht im Deploy
          rm -f _site/images/G2AE/*.png
      - name: Cache-bust assets with commit SHA
        run: |
          V="${GITHUB_SHA:0:8}"
          sed -i -E "s/\.(css|js|png|jpg|woff2)([\"')]| [0-9]+w)/.\1?v=$V\2/g" ./_site/*.html ./_site/style.css ./_site/fonts.css
          sed -i "s|</head>|  <meta name=\"build\" content=\"$GITHUB_SHA\">\n</head>|" ./_site/*.html
          sed -i "s|</loc>|</loc><lastmod>$(date -u +%Y-%m-%d)</lastmod>|g" ./_site/sitemap.xml
      - name: Verify local asset references
        run: |
          cd _site
          refs=$( { grep -ohE '(src|href)="[^"#]+"' ./*.html | sed -E 's/^[a-z]+="//; s/"$//'; \
                    grep -ohE 'srcset="[^"]+"' ./*.html | sed -E 's/^srcset="//; s/"$//' | tr ',' '\n' | sed -E 's/^ +//; s/ +[0-9]+w$//'; \
                    grep -ohE 'url\("?[^")]+"?\)' ./*.css | sed -E 's/^url\("?//; s/"?\)$//'; } \
            | sed -E 's/[?#].*$//' | grep -vE '^https?://' | grep -v '^$' | sort -u )
          status=0
          for f in $refs; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing referenced asset: $f"
              status=1
            fi
          done
          exit $status
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
