# Deployt die statische Webseite bei jedem Push auf main zu GitHub Pages.
name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir _site
          cp ./*.html ./style.css ./fonts.css ./site.js ./sitemap.xml ./robots.txt _site/
          cp -r ./images ./fonts _site/
          # Roh-Screenshots bleiben im Repo als Archiv, aber nicht im Deploy
          rm -f _site/images/G2AE/*.png
      - name: Cache-bust assets with commit SHA
        run: |
          V="${GITHUB_SHA:0:8}"
          sed -i -E "s/\.(css|js|png|jpg|webp|json|woff2)([\"')]| [0-9]+w)/.\1?v=$V\2/g" ./_site/*.html ./_site/style.css ./_site/fonts.css ./_site/site.js
          sed -i "s|</head>|  <meta name=\"build\" content=\"$GITHUB_SHA\">\n</head>|" ./_site/*.html
          sed -i "s|</loc>|</loc><lastmod>$(date -u +%Y-%m-%d)</lastmod>|g" ./_site/sitemap.xml
      - name: Verify local asset references
        run: |
          cd _site
          refs=$( { grep -ohE '(src|href)="[^"#]+"' ./*.html | sed -E 's/^[a-z]+="//; s/"$//'; \
                    grep -ohE 'srcset="[^"]+"' ./*.html | sed -E 's/^srcset="//; s/"$//' | tr ',' '\n' | sed -E 's/^ +//; s/ +[0-9]+w$//'; \
                    grep -ohE 'url\("?[^")]+"?\)' ./*.css | sed -E 's/^url\("?//; s/"?\)$//'; \
                    grep -ohE '(src|href)="[^"#]+"' ./site.js | sed -E 's/^[a-z]+="//; s/"$//'; \
                    grep -ohE "(images|fonts)/[A-Za-z0-9_.-]+" ./site.js | sort -u; } \
            | sed -E 's/[?#].*$//' | grep -vE '^https?://' | grep -v '^$' | sort -u )
          status=0
          for f in $refs; do
            if [ ! -e "$f" ]; then
              echo "::error::Missing referenced asset: $f"
              status=1
            fi
          done
          exit $status
      - name: Verify i18n key coverage
        run: |
          node <<'EOF'
          const fs = require('fs');
          const files = fs.readdirSync('.').filter(f => f.endsWith('.html'));
          const used = new Set();
          const scan = f => {
            for (const m of fs.readFileSync(f, 'utf8').matchAll(/data-i18n(?:-aria|-html)?="([^"]+)"/g))
              used.add(m[1]);
          };
          files.forEach(scan);
          scan('site.js'); // lightbox buttons are created via innerHTML
          const src = fs.readFileSync('site.js', 'utf8');
          const langs = {};
          for (const m of src.matchAll(/^    (de|en|pl|ru): \{([\s\S]*?)\n    \}/gm))
            langs[m[1]] = new Set([...m[2].matchAll(/^      (\w+):/gm)].map(x => x[1]));
          let fail = false;
          for (const [lang, keys] of Object.entries(langs)) {
            const missing = [...used].filter(k => !keys.has(k));
            if (missing.length) { console.error(`::error::${lang} missing keys: ${missing.join(', ')}`); fail = true; }
          }
          const sizes = new Set(Object.values(langs).map(s => s.size));
          if (sizes.size > 1) { console.error('::error::language dicts have different key counts'); fail = true; }
          process.exit(fail ? 1 : 0);
          EOF
      # STOPGAP: Solange die Pages-Quelle auf "Deploy from a branch" (legacy)
      # steht, baut GitHub zusaetzlich einen eigenen pages-build-deployment-
      # Lauf (~45s), der diesen Cache-Bust-Build ueberschreibt, weil er
      # spaeter fertig wird. Diese Wartezeit sorgt dafuer, dass unser
      # Deployment immer als letztes landet und somit live geht.
      # ENTFERNEN, sobald Settings -> Pages -> Source = "GitHub Actions".
      - name: Wait for legacy branch deploy
        run: sleep 75
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
